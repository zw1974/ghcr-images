name: Build and Push to GHCR

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: dtk-api
            dockerfile: docker/Dockerfile
            build_args: ""
          - tag: dtk-downloader
            dockerfile: docker/Dockerfile.downloader
            build_args: VERSION=ghcr
          - tag: dtk-transcriber
            dockerfile: docker/Dockerfile.transcriber
            build_args: ""
    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: Evil0ctal/Douyin_TikTok_Download_API
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ghcr.io/zw1974/ghcr-images:${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}
